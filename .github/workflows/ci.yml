name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Run backend tests and smoke check
        env:
          NODE_ENV: test
          PORT: 5000
          FRONTEND_URL: http://localhost:5173
          DEFAULT_CURRENCY: USD
          JWT_SECRET: ci-jwt-secret
          MONGO_URI: mongodb://localhost:27017/bokun_ci
          BOKUN_MOCK_MODE: true
          BOKUN_ACCESS_KEY: mock-access
          BOKUN_SECRET_KEY: mock-secret
          BOKUN_API_KEY: mock-api-key
          PESAPAL_MOCK_MODE: true
          PESAPAL_CONSUMER_KEY: mock-key
          PESAPAL_CONSUMER_SECRET: mock-secret
          PESAPAL_IPN_ID: mock-ipn
          PESAPAL_ALLOW_LOCAL_REDIRECTS: true
        run: |
          npm test
          npm run test:smoke

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
