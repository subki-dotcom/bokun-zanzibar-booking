name: Secret Scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  trufflehog-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # trufflesecurity/trufflehog-action does not exist; the maintained action lives in the main repo.
      - name: Run TruffleHog scan
        uses: trufflesecurity/trufflehog@v3.99.1
        with:
          extra_args: --results=verified,unknown
